<h3>Crisis Tax Return</h3>
<ul>
  @for (hero of heroes | async; track hero) {
    <li (click)="showTaxReturn(hero)">{{hero.name}}</li>
  }
</ul>

@for (selected of selectedTaxReturn; track selected; let i = $index) {
  <app-hero-tax-return [taxReturn]='selected'
  (close)="closeTaxReturn(i)"></app-hero-tax-return>
}
