<div class="container">
  <h1 class="title">Accessing query params</h1>
  <h2>Heroes</h2>
  <ul class="heroes">
    @for (hero of heroes$ | async; track hero) {
      <li [class.selected]="hero.id == heroId">
        <a [routerLink]="['/hero', hero.id]">
          <span class="badge">{{hero.id}}&#125;</span>
          {{hero.name}}
        </a>
      </li>
    }
  </ul>
</div>
